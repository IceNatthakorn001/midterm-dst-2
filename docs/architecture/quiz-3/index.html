<h1>Quiz: ข้อสอบจริง Quiz 3 — Lecture 3</h1>
<div class="sub">4 ข้อ จากข้อสอบจริง (ข้อความตามต้นฉบับ) — เลือกตอบ 1 ข้อ: กดตัวเลือกแล้วเห็นเฉลยทันที / เติมคำตอบ 3 ข้อ: พิมพ์คำตอบแล้วกดตรวจ (หรือกด Enter) — คะแนนนับจากครั้งแรกของแต่ละข้อ</div>

  "note": "เฉลยข้อนี้ไม่ได้ให้มากับข้อสอบ — คำนวณเองตามสูตรในสไลด์ Lecture 3"
 },
 {
  "type": "short",
  "num": 2,
  "q": "Consider the following set of processes, with the length of the CPU burst given in milliseconds.",
  "table": {
   "head": [
    "Process",
    "Burst Time",
    "Priority"
   ],
   "rows": [
    [
     "P1",
     "5",
     "2"
    ],
    [
     "P2",

     "1"

    [
     "P3",

     "4"

    [
     "P4",

     "2"

     "P5",

     "3"
    ]
   ]

  "after": "The processes are assumed to have arrived in the order P1, P2, P3, P4, P5, all at time 0.\nUsing the Priority scheduling, compute the turnaround time for P4.",
  "accept": [

  ],
  "answer": "คำตอบ: 10 (ms)",
  "explain": "Priority scheduling: ตัวเลขน้อย → priority สูง ได้ทำก่อน (สไลด์ Lecture 3)\n\nเรียงตาม priority: P2 (1) → P1 (2) → P4 (2) → P5 (3) → P3 (4)\nP1 กับ P4 priority เท่ากัน (2) → ใครมาก่อนได้ก่อน (FCFS) P1 มาก่อน P4\n\nลำดับการทำงาน (Gantt chart):\nP2: 0 → 1\nP1: 1 → 6\nP4: 6 → 10\nP5: 10 → 11\nP3: 11 → 14\n\nTurnaround time ของ P4 = เวลาเสร็จ − เวลามาถึง = 10 − 0 = 10 ms",
  "note": "เฉลยข้อนี้ไม่ได้ให้มากับข้อสอบ — คำนวณเองตามสไลด์ Lecture 3 (ตัวเลขน้อย = priority สูง, priority เท่ากันใช้ FCFS)"
 },
 {
  "type": "mcq",
  "num": 3,
  "q": "ข้อใดอธิบายความหมายของ CPU utilization ได้ตรงที่สุด",
  "choices": [
   "ช่วงเวลาที่ CPU ทำงานให้จำนวน process มากที่สุด",
   "ช่วงเวลาที่ CPU ทำงานจนหน่วยความจำเต็ม",
   "สัดส่วนของเวลาที่ CPU ทำงาน ต่อเวลาทั้งหมด",
   "ช่วงเวลาที่ CPU ทำงานได้ดีที่สุด"
  ],
  "correct": 2,
  "answer": "คำตอบ: c. สัดส่วนของเวลาที่ CPU ทำงาน ต่อเวลาทั้งหมด",
  "explain": "CPU utilization = เวลาที่ CPU ทำงาน (ไม่ว่าง) เทียบกับเวลาทั้งหมด มักบอกเป็น % เช่น CPU ทำงาน 90 จาก 100 ms = 90%\n\nเป้าหมายของ scheduling คือ max CPU utilization ให้ CPU ทำงานตลอด ไม่ว่างเปล่า (สไลด์ Lecture 3)\n\nข้ออื่นผิดเพราะ:\n\na. จำนวน process ที่ทำเสร็จต่อเวลา คือ throughput ไม่ใช่ CPU utilization\nb. หน่วยความจำเต็มไม่เกี่ยวกับ CPU utilization\nd. \"ทำงานได้ดีที่สุด\" ไม่ใช่นิยาม เป็นคำกว้าง ๆ ไม่ได้วัดอะไร",
  "note": "เฉลยข้อนี้ไม่ได้ให้มากับข้อสอบ — เขียนเพิ่มจากสไลด์ Lecture 3 (scheduling metrics)"
 },
 {
  "type": "short",
  "num": 4,
  "q": "Consider the following set of processes, with the length of the CPU burst given in milliseconds.",
  "table": {
   "head": [

    "Burst Time",
    "Priority"
   ],
   "rows": [

  "accept": [

  ],
  "answer": "คำตอบ: 9 (ms)",
  "explain": "SJF: ทำ process ที่ burst time สั้นที่สุดก่อน (ไม่สน priority)\n\nเรียงตาม burst time: P2 (1) → P5 (1) → P3 (3) → P4 (4) → P1 (5)\nP2 กับ P5 burst เท่ากัน (1) → ใครมาก่อนได้ก่อน (FCFS) P2 มาก่อน P5\n\nลำดับการทำงาน (Gantt chart):\nP2: 0 → 1\nP5: 1 → 2\nP3: 2 → 5\nP4: 5 → 9\nP1: 9 → 14\n\nTurnaround time ของ P4 = เวลาเสร็จ − เวลามาถึง = 9 − 0 = 9 ms",
  "note": "เฉลยข้อนี้ไม่ได้ให้มากับข้อสอบ — คำนวณเองตามสไลด์ Lecture 3 (SJF, burst เท่ากันใช้ FCFS)"
 }
];

let current = 0;
const shown = new Array(questions.length).fill(null);   // mcq: ตัวเลือกที่แสดงอยู่ / open: true เมื่อกดดูเฉลย
const first = new Array(questions.length).fill(null);   // ผลครั้งแรก: true/false

function buildJumpGrid() {
  document.getElementById('jumpGrid').innerHTML =
    questions.map((q, i) => '<button onclick="jumpTo(' + i + ')">' + (i + 1) + '</button>').join('');
  updateJumpGrid();
}
function updateJumpGrid() {
  Array.from(document.getElementById('jumpGrid').children).forEach((b, i) => {
    b.className = '';
    if (i === current) b.classList.add('current');
    if (first[i] !== null) b.classList.add(first[i] ? 'done-correct' : 'done-wrong');
  });
}
function jumpTo(i) { current = i; render(); }

function answerBox(qd, ok) {
  let h = '<div class="explain ' + (ok === null ? 'neutral-bg' : ok ? 'correct-bg' : 'wrong-bg') + '">';
  if (ok !== null) h += '<div class="verdict">' + (ok ? '✓ ถูก' : '✗ ผิด') + '</div>';
  h += '<div class="ans">' + qd.answer + '</div>';
  h += '<div class="body">' + qd.explain + '</div>';
  if (qd.note) h += '<div class="note">หมายเหตุ: ' + qd.note + '</div>';
  return h + '</div>';
}

function render() {
  updateJumpGrid();
  const area = document.getElementById('quizArea');
  if (current >= questions.length) return renderScore();
  const qd = questions[current];
  let h = '<div class="card"><div class="progress-row">';
  h += '<div class="progress">ข้อ ' + (current + 1) + ' / ' + questions.length + (qd.num ? ' · ข้อสอบข้อ ' + qd.num : '') + '</div>';
  h += '<div class="tag ' + qd.type + '">' + TAG_LABEL[qd.type] + '</div></div>';
  h += '<div class="question">' + qd.q + '</div>';
  if (qd.table) {
    h += '<table class="qtable"><tr>' + qd.table.head.map(c => '<th>' + c + '</th>').join('') + '</tr>';
    qd.table.rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>'; });
    h += '</table>';
  }
  if (qd.after) h += '<div class="question after">' + qd.after + '</div>';

  if (qd.type === 'match') {
    const st = matchState[current];
    qd.items.forEach((it, k) => {
      const v = st.pick[k];
      const ok = v === it.answer;
      h += '<div class="mrow' + (st.checked ? (ok ? ' mok' : ' mbad') : '') + '"><div class="mtext">' + it.text + '</div>';
      h += '<select ' + (st.checked ? 'disabled ' : '') + 'onchange="setPick(' + k + ', this.value)"><option value="">Choose...</option>';
      qd.options.forEach(o => { h += '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; });
      h += '</select>';
      if (st.checked) h += '<div class="mwhy">' + (ok ? '✓ ' : '✗ คำตอบ: <b>' + it.answer + '</b> — ') + it.why + '</div>';
      h += '</div>';
    });
    if (st.checked) {
      const n = qd.items.filter((it, k) => st.pick[k] === it.answer).length;
      h += '<div class="explain ' + (n === qd.items.length ? 'correct-bg' : 'wrong-bg') + '"><div class="verdict">ถูก ' + n + ' / ' + qd.items.length + ' ช่อง</div>';
      if (qd.note) h += '<div class="note">หมายเหตุ: ' + qd.note + '</div>';
      h += '</div><div class="fill-actions"><button class="ghost-btn" onclick="resetMatch()">ลองใหม่</button></div>';
    } else {
      h += '<div class="fill-actions"><button onclick="checkMatch()" ' + (st.pick.includes('') ? 'disabled' : '') + '>ตรวจคำตอบ</button></div>';
    }
  } else if (qd.type === 'short') {
    const st = shortState[current];
    h += '<div class="short-row"><label for="shortIn">Answer:</label><input id="shortIn" type="text" autocomplete="off" value="' + st.val.replace(/"/g, "&quot;") + '" ' + (st.checked ? 'disabled ' : '') + 'oninput="shortState[current].val = this.value" onkeydown="if (event.key === \x27Enter\x27) checkShort()"></div>';
    if (st.checked) {
      h += answerBox(qd, isShortRight(qd, st.val));
      h += '<div class="fill-actions"><button class="ghost-btn" onclick="resetShort()">ลองใหม่</button></div>';
    } else {
      h += '<div class="fill-actions"><button onclick="checkShort()">ตรวจคำตอบ</button></div>';
    }
  } else if (qd.type === 'mcq') {
    const c = shown[current];
    qd.choices.forEach((ch, i) => {
      let cls = 'choice';
      if (c !== null) { if (i === qd.correct) cls += ' correct'; else if (i === c) cls += ' wrong'; }
      h += '<button class="' + cls + '" onclick="pick(' + i + ')">' + 'abcd'[i] + '. ' + ch + '</button>';
    });
    if (c !== null) h += answerBox(qd, c === qd.correct);
  } else {
    if (!shown[current]) {
      h += '<div class="hint">ต้นฉบับไม่มีตัวเลือก — คิดคำตอบในใจก่อน แล้วกดดูเฉลย</div>';
      h += '<div class="fill-actions"><button onclick="reveal()">ดูเฉลย</button></div>';
    } else {
      h += answerBox(qd, null);
      if (first[current] === null) {
        h += '<div class="selfmark">ตอบถูกไหม? <button class="okb" onclick="mark(true)">ตอบถูก</button><button class="nob" onclick="mark(false)">ตอบผิด</button></div>';
      } else {
        h += '<div class="selfmark">ให้คะแนนตัวเองแล้ว: ' + (first[current] ? 'ตอบถูก' : 'ตอบผิด') + '</div>';
      }
    }
  }
  h += '<div class="nav"><button class="nav-btn" onclick="prevQ()" ' + (current === 0 ? 'disabled' : '') + '>ก่อนหน้า</button>';
  h += '<button class="nav-btn" onclick="nextQ()">' + (current === questions.length - 1 ? 'ดูสรุปคะแนน' : 'ถัดไป') + '</button></div></div>';
  area.innerHTML = h;
}

function pick(i) {
  if (first[current] === null) first[current] = i === questions[current].correct;
  shown[current] = i; render();
}
const newMatch = q => q.type === 'match' ? { pick: q.items.map(() => ''), checked: false } : null;
const matchState = questions.map(newMatch);
function setPick(k, v) { matchState[current].pick[k] = v; render(); }
function checkMatch() {
  const qd = questions[current], st = matchState[current];
  st.checked = true;
  if (first[current] === null) {
    first[current] = qd.items.every((it, k) => st.pick[k] === it.answer);
    firstItems[current] = qd.items.filter((it, k) => st.pick[k] === it.answer).length;
  }
  render();
}
const firstItems = new Array(questions.length).fill(null); // ข้อจับคู่: จำนวนช่องที่ถูกในการตรวจครั้งแรก
function resetMatch() { matchState[current] = newMatch(questions[current]); render(); }
const newShort = q => q.type === 'short' ? { val: '', checked: false } : null;
const shortState = questions.map(newShort);
// เทียบคำตอบ: ไม่สนช่องว่าง/ตัวพิมพ์ และตัดหน่วย ms ท้ายคำตอบ
function isShortRight(qd, v) { return qd.accept.includes(v.toLowerCase().replace(/\s+/g, '').replace(/(ms|milliseconds?)$/, '')); }
function checkShort() {
  const qd = questions[current], st = shortState[current];
  if (!st.val.trim()) return;
  st.checked = true;
  if (first[current] === null) first[current] = isShortRight(qd, st.val);
  render();
}
function resetShort() { shortState[current] = newShort(questions[current]); render(); }
function reveal() { shown[current] = true; render(); }
function mark(ok) { if (first[current] === null) first[current] = ok; render(); }
function nextQ() { current = current < questions.length - 1 ? current + 1 : questions.length; render(); }
function prevQ() { if (current > 0) current--; render(); }

function renderScore() {
  const by = { match: [0, 0], mcq: [0, 0], short: [0, 0], open: [0, 0] };
  questions.forEach((q, i) => { by[q.type][1]++; if (first[i]) by[q.type][0]++; });
  const score = Object.values(by).reduce((a, b) => a + b[0], 0);
  let h = '<div class="card score-box"><div>คุณทำแบบทดสอบเสร็จแล้ว</div>';
  // ควิซที่มีแค่ข้อจับคู่ข้อเดียว: คะแนนใหญ่ = จำนวนช่องที่ถูก
  const onlyMatch = questions.length === 1 && questions[0].type === 'match';
  h += '<div class="big">' + (onlyMatch ? (firstItems[0] || 0) + ' / ' + questions[0].items.length + ' ช่อง' : score + ' / ' + questions.length) + '</div><div class="breakdown">';
  if (onlyMatch) { h += '</div><button id="restartBtn" onclick="restart()">ทำใหม่อีกครั้ง</button></div>'; document.getElementById('quizArea').innerHTML = h; return; }
  Object.keys(by).forEach(t => { if (by[t][1]) h += '<div><span>' + TAG_LABEL[t] + '</span><span>' + by[t][0] + ' / ' + by[t][1] + '</span></div>'; });
  questions.forEach((q, i) => {
    if (q.type === 'match') h += '<div><span>' + (questions.length > 1 ? 'ข้อ ' + (i + 1) + ' ' : '') + 'จับคู่ถูก (ช่อง)</span><span>' + (firstItems[i] || 0) + ' / ' + q.items.length + '</span></div>';
  });
  h += '</div><button id="restartBtn" onclick="restart()">ทำใหม่อีกครั้ง</button></div>';
  document.getElementById('quizArea').innerHTML = h;
}
function restart() { current = 0; shown.fill(null); first.fill(null); firstItems.fill(null); questions.forEach((q, i) => { matchState[i] = newMatch(q); shortState[i] = newShort(q); }); render(); }

buildJumpGrid();
render();
</script>
