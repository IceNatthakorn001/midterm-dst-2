let current = 0;
const answered = new Array(questions.length).fill(null); // currently displayed choice per question
const firstChoices = new Array(questions.length).fill(null); // choice used for scoring (first click only)

function buildJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  let html = '';
  questions.forEach((q, i) => {
    html += '<button data-i="' + i + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  });
  grid.innerHTML = html;
  updateJumpGrid();
}

function updateJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  Array.from(grid.children).forEach((btn, i) => {
    btn.className = '';
    if (i === current && current < questions.length) btn.classList.add('current');
    if (firstChoices[i] !== null) {
      btn.classList.add(firstChoices[i] === questions[i].correct ? 'done-correct' : 'done-wrong');
    }
  });
}

function jumpTo(i) {
  current = i;
  render();
}

function render() {
  const area = document.getElementById('quizArea');
  updateJumpGrid();
  if (current >= questions.length) {
    renderScore();
    return;
  }
  const qd = questions[current];
  const chosen = answered[current];

  let html = '<div class="card">';
  html += '<div class="progress-row">';
  html += '<div class="progress">ข้อ ' + (current+1) + ' / ' + questions.length + '</div>';
  html += '<div class="tag ' + qd.type + '">' + TAG_LABEL[qd.type] + '</div>';
  html += '</div>';
  html += '<div class="question">' + qd.q + '</div>';

  qd.choices.forEach((c, i) => {
    let cls = 'choice';
    if (chosen !== null) {
      if (i === qd.correct) cls += ' correct';
      else if (i === chosen) cls += ' wrong';
    }
    html += '<button class="' + cls + '" onclick="selectChoice(' + i + ')">' + 'กขคง'[i] + '. ' + c + '</button>';
    if (chosen !== null && i === chosen) {
      const bgCls = (i === qd.correct) ? 'correct-bg' : 'wrong-bg';
      html += '<div class="explain ' + bgCls + '">' + qd.explain[i] + '</div>';
    }
  });

  html += '<div class="nav">';
  html += '<button class="nav-btn" onclick="prevQ()" ' + (current===0?'disabled':'') + '>ก่อนหน้า</button>';
  html += '<button class="nav-btn" onclick="nextQ()">' + (current===questions.length-1 ? 'ดูสรุปคะแนน' : 'ถัดไป') + '</button>';
  html += '</div>';
  html += '</div>';

  area.innerHTML = html;
}

function selectChoice(i) {
  if (firstChoices[current] === null) {
    firstChoices[current] = i;
  }
  answered[current] = i;
  render();
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
  } else {
    current = questions.length; // trigger score screen
  }
  render();
}

function prevQ() {
  if (current > 0) current--;
  render();
}

function renderScore() {
  const score = firstChoices.reduce((acc, val, idx) => {
    return (val !== null && val === questions[idx].correct) ? acc + 1 : acc;
  }, 0);

  const byType = { recall: [0,0], understand: [0,0], apply: [0,0], calc: [0,0] };
  questions.forEach((qd, idx) => {
    byType[qd.type][1]++;
    if (firstChoices[idx] !== null && firstChoices[idx] === qd.correct) byType[qd.type][0]++;
  });

  const area = document.getElementById('quizArea');
  let html = '<div class="card score-box">';
  html += '<div>คุณทำแบบทดสอบเสร็จแล้ว</div>';
  html += '<div class="big">' + score + ' / ' + questions.length + '</div>';
  html += '<div class="breakdown">';
  Object.keys(byType).forEach(t => {
    if (byType[t][1] > 0) html += '<div><span>' + TAG_LABEL[t] + '</span><span>' + byType[t][0] + ' / ' + byType[t][1] + '</span></div>';
  });
  html += '</div>';
  html += '<button id="restartBtn" onclick="restart()">ทำใหม่อีกครั้ง</button>';
  html += '</div>';
  area.innerHTML = html;
}

function restart() {
  current = 0;
  for (let i = 0; i < questions.length; i++) {
    answered[i] = null;
    firstChoices[i] = null;
  }
  render();
}

buildJumpGrid();
render();
</script>
