<style>
  body {
    font-family: "Segoe UI", "Tahoma", sans-serif;

    margin: 0 auto;

  }

  .card {

  button.nav-btn {

  .breakdown {

  .jumpgrid {

<h1>Quiz: Quiz 6 — Text Editor nano / vim (ข้อสอบจริง)</h1>
<div class="sub">10 ข้อ แบ่งเป็นความจำ 10 ข้อ — กดเลือกคำตอบแต่ละข้อ จะเห็นเหตุผลทันที คะแนนนับจากการกดครั้งแรกของแต่ละข้อเท่านั้น</div>

<div class="jumpgrid" id="jumpGrid"></div>
<div id="quizArea"></div>

<script>
const TAG_LABEL = { recall: "ความจำ", understand: "ความเข้าใจ", apply: "การนำไปใช้", calc: "การคำนวณ" };

const questions = [
 {
  "type": "recall",
  "q": "ในโปรแกรม nano เมื่อต้องการบันทึกข้อมูลลงบนไฟล์ที่ถูกเปิดอยู่แล้ว และออกจากโปรแกรมเมื่อการบันทึกเสร็จสิ้น ต้องใช้คำสั่งอะไร",
  "choices": [
   "กดปุ่ม CTRL + O แล้วตามด้วย กดปุ่ม CTRL + E",
   "กดปุ่ม CTRL + O แล้วตามด้วย กดปุ่ม CTRL + X",
   "กดปุ่ม CTRL + D แล้วตามด้วย กดปุ่ม CTRL + X",
   "กดปุ่ม CTRL + X แล้วตามด้วย กดปุ่ม CTRL + V"
  ],
  "correct": 1,
  "explain": [
   "ผิด — CTRL + O บันทึกได้จริง แต่ CTRL + E คือเลื่อน cursor ไปท้ายบรรทัด ไม่ได้ออกจากโปรแกรม",
   "ถูก — CTRL + O = Write Out (บันทึกไฟล์ แล้วกด Enter ยืนยันชื่อไฟล์) จากนั้น CTRL + X = Exit (ออกจาก nano)",
   "ผิด — CTRL + D คือลบตัวอักษรที่ cursor ทับอยู่ ไม่ใช่การบันทึก จึงยังไม่ได้เซฟก่อนออก",
   "ผิด — CTRL + X คือออกจากโปรแกรมก่อนโดยยังไม่ได้สั่งบันทึก ส่วน CTRL + V คือเลื่อนลงหนึ่งหน้า"
  ]
 },
 {
  "type": "recall",
  "q": "ถ้าต้องการออกจาก vim ใน Command Mode โดยไม่มีการบันทึก ควรใช้คำสั่งใด?",
  "choices": [
   ":w",
   ":q!",
   ":q",
   ":wq"
  ],
  "correct": 1,
  "explain": [
   "ผิด — :w (write) คือบันทึกไฟล์อย่างเดียว ไม่ได้ออกจาก vim",
   "ถูก — :q! คือออกแบบบังคับ ทิ้งการแก้ไขทั้งหมดโดยไม่บันทึก (! = บังคับ)",
   "ผิด — :q ออกได้เฉพาะตอนที่ไม่มีการแก้ไขค้างอยู่ ถ้าแก้ไฟล์ไปแล้ว vim จะฟ้อง error ไม่ยอมออก",
   "ผิด — :wq คือบันทึกแล้วออก ซึ่งตรงข้ามกับที่โจทย์ต้องการ"
  ]
 },
 {
  "type": "recall",
  "q": "สัญลักษณ์ ^ ในโปรแกรม nano หมายถึงการกดปุ่มใด?",
  "choices": [
   "Alt",
   "Ctrl",
   "Shift",
   "Esc"
  ],
  "correct": 1,
  "explain": [
   "ผิด — ปุ่ม Alt ใน nano เขียนแทนด้วย M- (Meta) เช่น M-U = Alt + U (undo)",
   "ถูก — ^ หมายถึงปุ่ม Ctrl เช่น ^X = Ctrl + X (ออก), ^O = Ctrl + O (บันทึก)",
   "ผิด — nano ไม่ได้ใช้ ^ แทนปุ่ม Shift",
   "ผิด — Esc ใช้แทนปุ่ม Meta (M-) ได้ ไม่ใช่สัญลักษณ์ ^"
  ]
 },
 {
  "type": "recall",
  "q": "ใน Command Mode ของ vim การกด `dd` ทำให้เกิดผลอะไร?",
  "choices": [
   "ลบคำที่ Cursor ทับอยู่",
   "ลบทั้งบรรทัด",
   "ลบจาก Cursor ถึงท้ายบรรทัดแล้วเข้า Insert Mode",
   "ลบตัวอักษร 1 ตัว"
  ],
  "correct": 1,
  "explain": [
   "ผิด — การลบคำใช้ dw (delete word)",
   "ถูก — dd ลบ (ตัด) ทั้งบรรทัดที่ cursor อยู่ และเก็บไว้ให้นำไปวางด้วย p / P ได้",
   "ผิด — การลบจาก cursor ถึงท้ายบรรทัดแล้วเข้า Insert Mode ใช้ C (หรือ c$)",
   "ผิด — การลบตัวอักษร 1 ตัวใช้ x"
  ]
 },
 {
  "type": "recall",
  "q": "ใน vim Command Mode ถ้าต้องการวางข้อความที่คัดลอก (yank) หรือตัด (cut) ไว้แล้ว ให้อยู่เหนือบรรทัดปัจจุบัน ควรใช้คำสั่งใด?",
  "choices": [
   "p",
   "d",
   "P",
   "y"
  ],
  "correct": 2,
  "explain": [
   "ผิด — p (ตัวเล็ก) วางไว้ใต้บรรทัดปัจจุบัน (หรือหลัง cursor)",
   "ผิด — d คือคำสั่งลบ/ตัด (delete) ไม่ใช่การวาง",
   "ถูก — P (ตัวใหญ่) วางไว้เหนือบรรทัดปัจจุบัน (หรือก่อน cursor)",
   "ผิด — y คือคำสั่งคัดลอก (yank) ไม่ใช่การวาง"
  ]
 },
 {
  "type": "recall",
  "q": "ในโปรแกรม vim คำสั่งใดใน Command Mode ที่ใช้สำหรับแทนที่คำทั้งหมดในไฟล์?",
  "choices": [
   ":%s/old/new/g",
   ":s/old/new/g",
   ":r/old/new/g",
   ":%r/old/new/g"
  ],
  "correct": 0,
  "explain": [
   "ถูก — % = ทุกบรรทัดในไฟล์, s = substitute (แทนที่), g = แทนทุกคำที่เจอในบรรทัด ไม่ใช่แค่คำแรก",
   "ผิด — ไม่มี % จึงแทนที่เฉพาะบรรทัดที่ cursor อยู่เท่านั้น ไม่ใช่ทั้งไฟล์",
   "ผิด — :r คือ read (อ่านไฟล์อื่นเข้ามาแทรก) ไม่ใช่คำสั่งแทนที่",
   "ผิด — แม้มี % แต่ r ไม่ใช่คำสั่งแทนที่ ต้องใช้ s (substitute)"
  ]
 },
 {
  "type": "recall",
  "q": "ในโปรแกรม vim ถ้าต้องการค้นหาคำในไฟล์ใน Command Mode ควรเริ่มต้นด้วยสัญลักษณ์ใด?",
  "choices": [
   "?",
   "!",
   ":",
   "/"
  ],
  "correct": 3,
  "explain": [
   "ผิด — ?คำ ค้นหาได้เหมือนกัน แต่เป็นการค้นย้อนกลับ (ขึ้นไปต้นไฟล์) คำตอบมาตรฐานของการค้นหาทั่วไปคือ /",
   "ผิด — ! ใช้รันคำสั่ง shell (:!ls) หรือบังคับคำสั่ง (:q!) ไม่ใช่การค้นหา",
   "ผิด — : ใช้เข้าโหมดพิมพ์คำสั่ง เช่น :w, :q, :wq",
   "ถูก — /คำ ค้นหาไปข้างหน้า (จาก cursor ลงไปท้ายไฟล์) กด n ไปคำถัดไป, N ย้อนกลับ"
  ]
 },
 {
  "type": "recall",
  "q": "ใน Command Mode ของ vim หากกด `yy` จะทำให้เกิดผลอะไร?",
  "choices": [
   "คัดลอกข้อความทั้งบรรทัด",
   "คัดลอกหนึ่งคำ",
   "ตัดข้อความทั้งบรรทัด",
   "วางข้อความ"
  ],
  "correct": 0,
  "explain": [
   "ถูก — yy = yank (คัดลอก) ทั้งบรรทัดที่ cursor อยู่ แล้วนำไปวางด้วย p / P",
   "ผิด — การคัดลอกหนึ่งคำใช้ yw (yank word)",
   "ผิด — การตัดทั้งบรรทัดใช้ dd",
   "ผิด — การวางข้อความใช้ p (ใต้บรรทัด) หรือ P (เหนือบรรทัด)"
  ]
 },
 {
  "type": "recall",
  "q": "ใน Command Mode ของ vim ถ้าต้องการลบตัวอักษร 1 ตัวที่ Cursor ทับอยู่ ควรใช้คำสั่งใด?",
  "choices": [
   "X",
   "x",
   "s",
   "d"
  ],
  "correct": 1,
  "explain": [
   "ผิด — X (ตัวใหญ่) ลบตัวอักษรที่อยู่ก่อนหน้า cursor (เหมือน Backspace)",
   "ถูก — x (ตัวเล็ก) ลบตัวอักษร 1 ตัวที่ cursor ทับอยู่ และยังอยู่ใน Command Mode",
   "ผิด — s ลบตัวอักษรที่ cursor แล้วเข้า Insert Mode ต่อทันที (substitute)",
   "ผิด — d ต้องตามด้วยคำสั่งเคลื่อนที่ก่อนถึงจะลบ เช่น dw (ลบคำ), dd (ลบบรรทัด)"
  ]
 },
 {
  "type": "recall",
  "q": "ใน Command Mode ของ vim ถ้าต้องการเริ่มพิมพ์ข้อความตรงท้ายสุดของบรรทัด ควรใช้คำสั่งใดเพื่อเข้าสู่ Insert Mode?",
  "choices": [
   "A",
   "a",
   "i",
   "I"
  ],
  "correct": 0,
  "explain": [
   "ถูก — A (ตัวใหญ่) = Append ที่ท้ายสุดของบรรทัด",
   "ผิด — a (ตัวเล็ก) พิมพ์ต่อหลังตำแหน่ง cursor ไม่ใช่ท้ายบรรทัด",
   "ผิด — i พิมพ์แทรกก่อนตำแหน่ง cursor",
   "ผิด — I (ตัวใหญ่) พิมพ์ที่ต้นบรรทัด"
  ]
 }
];

let current = 0;
const answered = new Array(questions.length).fill(null); // currently displayed choice per question
const firstChoices = new Array(questions.length).fill(null); // choice used for scoring (first click only)

function buildJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  let html = '';
  questions.forEach((q, i) => {
    html += '<button data-i="' + i + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  });
  grid.innerHTML = html;
  updateJumpGrid();
}

function updateJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  Array.from(grid.children).forEach((btn, i) => {
    btn.className = '';
    if (i === current && current < questions.length) btn.classList.add('current');
    if (firstChoices[i] !== null) {
      btn.classList.add(firstChoices[i] === questions[i].correct ? 'done-correct' : 'done-wrong');
    }
  });
}

function jumpTo(i) {
  current = i;
  render();
}

function render() {
  const area = document.getElementById('quizArea');
  updateJumpGrid();
  if (current >= questions.length) {
    renderScore();
    return;
  }
  const qd = questions[current];
  const chosen = answered[current];

  let html = '<div class="card">';
  html += '<div class="progress-row">';
  html += '<div class="progress">ข้อ ' + (current+1) + ' / ' + questions.length + '</div>';
  html += '<div class="tag ' + qd.type + '">' + TAG_LABEL[qd.type] + '</div>';
  html += '</div>';
  html += '<div class="question">' + qd.q + '</div>';

  qd.choices.forEach((c, i) => {
    let cls = 'choice';
    if (chosen !== null) {
      if (i === qd.correct) cls += ' correct';
      else if (i === chosen) cls += ' wrong';
    }
    html += '<button class="' + cls + '" onclick="selectChoice(' + i + ')">' + 'กขคง'[i] + '. ' + c + '</button>';
    if (chosen !== null && i === chosen) {
      const bgCls = (i === qd.correct) ? 'correct-bg' : 'wrong-bg';
      html += '<div class="explain ' + bgCls + '">' + qd.explain[i] + '</div>';
    }
  });

  html += '<div class="nav">';
  html += '<button class="nav-btn" onclick="prevQ()" ' + (current===0?'disabled':'') + '>ก่อนหน้า</button>';
  html += '<button class="nav-btn" onclick="nextQ()">' + (current===questions.length-1 ? 'ดูสรุปคะแนน' : 'ถัดไป') + '</button>';
  html += '</div>';
  html += '</div>';

  area.innerHTML = html;
}

function selectChoice(i) {
  if (firstChoices[current] === null) {
    firstChoices[current] = i;
  }
  answered[current] = i;
  render();
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
  } else {
    current = questions.length; // trigger score screen
  }
  render();
}

function prevQ() {
  if (current > 0) current--;
  render();
}

function renderScore() {
  const score = firstChoices.reduce((acc, val, idx) => {
    return (val !== null && val === questions[idx].correct) ? acc + 1 : acc;
  }, 0);

  const byType = { recall: [0,0], understand: [0,0], apply: [0,0], calc: [0,0] };
  questions.forEach((qd, idx) => {
    byType[qd.type][1]++;
    if (firstChoices[idx] !== null && firstChoices[idx] === qd.correct) byType[qd.type][0]++;
  });

  const area = document.getElementById('quizArea');
  let html = '<div class="card score-box">';
  html += '<div>คุณทำแบบทดสอบเสร็จแล้ว</div>';
  html += '<div class="big">' + score + ' / ' + questions.length + '</div>';
  html += '<div class="breakdown">';
  Object.keys(byType).forEach(t => {
    if (byType[t][1] > 0) html += '<div><span>' + TAG_LABEL[t] + '</span><span>' + byType[t][0] + ' / ' + byType[t][1] + '</span></div>';
  });
  html += '</div>';
  html += '<button id="restartBtn" onclick="restart()">ทำใหม่อีกครั้ง</button>';
  html += '</div>';
  area.innerHTML = html;
}

function restart() {
  current = 0;
  for (let i = 0; i < questions.length; i++) {
    answered[i] = null;
    firstChoices[i] = null;
  }
  render();
}

buildJumpGrid();
render();
</script>

</body>
