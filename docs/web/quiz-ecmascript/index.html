let current = 0;
const answered = new Array(questions.length).fill(null); // currently displayed choice per question
const firstChoices = new Array(questions.length).fill(null); // choice used for scoring (first click only); ข้อ fill เก็บ true/false ของการตรวจครั้งแรก
// สถานะข้อลากเติมคำ: placed[k] = index ของคำใน bank ที่วางในช่อง k, sel = คำที่แตะเลือกไว้
const fillState = questions.map(newFillState);

function newFillState(q) {
  return q.type === 'fill' ? { placed: q.blanks.map(() => null), checked: false, sel: null } : null;
}

function isRight(i) {
  if (firstChoices[i] === null) return false;
  return questions[i].type === 'fill' ? firstChoices[i] === true : firstChoices[i] === questions[i].correct;
}

function buildJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  let html = '';
  questions.forEach((q, i) => {
    html += '<button data-i="' + i + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  });
  grid.innerHTML = html;
  updateJumpGrid();
}

function updateJumpGrid() {
  const grid = document.getElementById('jumpGrid');
  Array.from(grid.children).forEach((btn, i) => {
    btn.className = '';
    if (i === current && current < questions.length) btn.classList.add('current');
    if (firstChoices[i] !== null) {
      btn.classList.add(isRight(i) ? 'done-correct' : 'done-wrong');
    }
  });
}

function jumpTo(i) {
  current = i;
  render();
}

function render() {
  const area = document.getElementById('quizArea');
  updateJumpGrid();
  if (current >= questions.length) {
    renderScore();
    return;
  }
  const qd = questions[current];
  const chosen = answered[current];

  let html = '<div class="card">';
  html += '<div class="progress-row">';
  html += '<div class="progress">ข้อ ' + (current+1) + ' / ' + questions.length + '</div>';
  html += '<div class="tag ' + qd.type + '">' + TAG_LABEL[qd.type] + '</div>';
  html += '</div>';
  html += '<div class="question">' + qd.q + '</div>';

  if (qd.type === 'fill') html += fillHtml(qd, fillState[current]);
  else qd.choices.forEach((c, i) => {
    let cls = 'choice';
    if (chosen !== null) {
      if (i === qd.correct) cls += ' correct';
      else if (i === chosen) cls += ' wrong';
    }
    html += '<button class="' + cls + '" onclick="selectChoice(' + i + ')">' + 'กขคง'[i] + '. ' + c + '</button>';
    if (chosen !== null && i === chosen) {
      const bgCls = (i === qd.correct) ? 'correct-bg' : 'wrong-bg';
      html += '<div class="explain ' + bgCls + '">' + qd.explain[i] + '</div>';
    }
  });

  html += '<div class="nav">';
  html += '<button class="nav-btn" onclick="prevQ()" ' + (current===0?'disabled':'') + '>ก่อนหน้า</button>';
  html += '<button class="nav-btn" onclick="nextQ()">' + (current===questions.length-1 ? 'ดูสรุปคะแนน' : 'ถัดไป') + '</button>';
  html += '</div>';
  html += '</div>';

  area.innerHTML = html;
}

function fillHtml(qd, st) {
  let html = '<div class="fill-text">';
  qd.parts.forEach((p, k) => {
    html += p;
    if (k >= qd.blanks.length) return;
    const c = st.placed[k];
    const ok = c !== null && qd.bank[c] === qd.blanks[k];
    let cls = 'slot';
    if (st.checked) cls += ok ? ' correct' : ' wrong';
    else if (c !== null) cls += ' filled';
    else if (st.sel !== null) cls += ' target';
    html += '<span class="' + cls + '" data-slot="' + k + '">' + (c !== null ? qd.bank[c] : '&nbsp;') + '</span>';
    if (st.checked && !ok) html += '<span class="slot-ans">(' + qd.blanks[k] + ')</span>';
  });
  html += '</div>';

  html += '<div class="bank-label">ลากคำไปวางในช่องว่าง หรือแตะคำแล้วแตะช่อง — แตะคำในช่องเพื่อเอาออก</div>';
  html += '<div class="bank">';
  qd.bank.forEach((w, i) => {
    let cls = 'chip';
    if (st.placed.includes(i)) cls += ' used';
    if (st.sel === i) cls += ' sel';
    html += '<span class="' + cls + '" data-chip="' + i + '">' + w + '</span>';
  });
  html += '</div>';

  if (st.checked) {
    const allOk = st.placed.every((c, k) => c !== null && qd.bank[c] === qd.blanks[k]);
    html += '<div class="explain ' + (allOk ? 'correct-bg' : 'wrong-bg') + '">' + qd.explain + '</div>';
    html += '<div class="fill-actions"><button class="ghost-btn" onclick="resetFill()">ลองใหม่</button></div>';
  } else {
    html += '<div class="fill-actions">';
    html += '<button onclick="checkFill()" ' + (st.placed.includes(null) ? 'disabled' : '') + '>ตรวจคำตอบ</button>';
    html += '<button class="ghost-btn" onclick="resetFill()">ล้างช่อง</button>';
    html += '</div>';
  }
  return html;
}

function checkFill() {
  const qd = questions[current], st = fillState[current];
  if (st.placed.includes(null)) return;
  st.checked = true;
  st.sel = null;
  if (firstChoices[current] === null) {
    firstChoices[current] = st.placed.every((c, k) => qd.bank[c] === qd.blanks[k]);
  }
  render();
}

function resetFill() {
  fillState[current] = newFillState(questions[current]);
  render();
}

// วางคำ chip ลงช่อง k (from = ช่องเดิมถ้าลากมาจากช่องอื่น จะสลับคำกัน)
function placeChip(st, chip, k, from) {
  const prev = st.placed[k];
  st.placed = st.placed.map(c => c === chip ? null : c);
  st.placed[k] = chip;
  if (from !== null && from !== k && prev !== null) st.placed[from] = prev;
}

let drag = null;

function endDrag() {
  if (drag && drag.ghost) drag.ghost.remove();
  document.querySelectorAll('.slot.over').forEach(el => el.classList.remove('over'));
  drag = null;
}

function slotAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.slot') : null;
}

document.addEventListener('pointerdown', e => {
  const qd = questions[current];
  if (!qd || qd.type !== 'fill') return;
  const st = fillState[current];
  if (st.checked) return;
  const chipEl = e.target.closest('.chip');
  const slotEl = e.target.closest('.slot');
  if (chipEl && !chipEl.classList.contains('used')) {
    drag = { chip: +chipEl.dataset.chip, from: null };
  } else if (slotEl && st.placed[+slotEl.dataset.slot] !== null) {
    drag = { chip: st.placed[+slotEl.dataset.slot], from: +slotEl.dataset.slot };
  } else if (slotEl && st.sel !== null) {
    placeChip(st, st.sel, +slotEl.dataset.slot, null);
    st.sel = null;
    render();
    return;
  } else return;
  e.preventDefault();
  drag.x = e.clientX; drag.y = e.clientY; drag.moved = false; drag.ghost = null;
});

document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.moved = true;
    drag.ghost = document.createElement('span');
    drag.ghost.className = 'chip ghost';
    drag.ghost.innerHTML = questions[current].bank[drag.chip];
    document.body.appendChild(drag.ghost);
  }
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.slot.over').forEach(el => el.classList.remove('over'));
  const slot = slotAt(e.clientX, e.clientY);
  if (slot) slot.classList.add('over');
});

document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag, st = fillState[current];
  endDrag();
  if (d.moved) {
    const slot = slotAt(e.clientX, e.clientY);
    if (slot) placeChip(st, d.chip, +slot.dataset.slot, d.from);
    else if (d.from !== null) st.placed[d.from] = null;
    st.sel = null;
  } else if (d.from !== null) {
    // แตะคำในช่อง: ถ้าเลือกคำไว้อยู่ให้แทนที่ ไม่งั้นเอาคำออก
    if (st.sel !== null) placeChip(st, st.sel, d.from, null);
    else st.placed[d.from] = null;
    st.sel = null;
  } else {
    st.sel = st.sel === d.chip ? null : d.chip;
  }
  render();
});

document.addEventListener('pointercancel', endDrag);

function selectChoice(i) {
  if (firstChoices[current] === null) {
    firstChoices[current] = i;
  }
  answered[current] = i;
  render();
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
  } else {
    current = questions.length; // trigger score screen
  }
  render();
}

function prevQ() {
  if (current > 0) current--;
  render();
}

function renderScore() {
  const score = questions.reduce((acc, qd, idx) => isRight(idx) ? acc + 1 : acc, 0);

  const byType = { recall: [0,0], understand: [0,0], apply: [0,0], calc: [0,0], fill: [0,0] };
  questions.forEach((qd, idx) => {
    byType[qd.type][1]++;
    if (isRight(idx)) byType[qd.type][0]++;
  });

  const area = document.getElementById('quizArea');
  let html = '<div class="card score-box">';
  html += '<div>คุณทำแบบทดสอบเสร็จแล้ว</div>';
  html += '<div class="big">' + score + ' / ' + questions.length + '</div>';
  html += '<div class="breakdown">';
  Object.keys(byType).forEach(t => {
    if (byType[t][1] > 0) html += '<div><span>' + TAG_LABEL[t] + '</span><span>' + byType[t][0] + ' / ' + byType[t][1] + '</span></div>';
  });
  html += '</div>';
  html += '<button id="restartBtn" onclick="restart()">ทำใหม่อีกครั้ง</button>';
  html += '</div>';
  area.innerHTML = html;
}

function restart() {
  current = 0;
  for (let i = 0; i < questions.length; i++) {
    answered[i] = null;
    firstChoices[i] = null;
    fillState[i] = newFillState(questions[i]);
  }
  render();
}

buildJumpGrid();
render();
</script>
